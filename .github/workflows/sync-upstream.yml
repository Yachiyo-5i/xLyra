name: Sync from Upstream

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Sync main from upstream
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Sync from upstream
        run: |
          git remote add upstream https://github.com/Yachiyo-5i/xLyra.git
          git fetch upstream
          git checkout main
          git reset --hard upstream/main
          git push origin main --force
